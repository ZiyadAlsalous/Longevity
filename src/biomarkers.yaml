    iu/l: 1.0
  optimal_low: null
  optimal_high: 33.0
  critical_low: null
  critical_high: 200.0
  aging_relevance: >-
    Mildly elevated ALT in the absence of alcohol excess is most often associated with
    hepatic fat accumulation, which tracks closely with insulin resistance.
  citation: >-
    Kwo PY et al. "ACG Clinical Guideline: Evaluation of Abnormal Liver Chemistries."
    Am J Gastroenterol, 2017.

- canonical_name: ast
  display_name: AST
  synonyms: [ast, aspartate aminotransferase, sgot, ast (sgot)]
  canonical_unit: U/L
  unit_conversions:
    iu/l: 1.0
  optimal_low: null
  optimal_high: 33.0
  critical_low: null
  critical_high: 200.0
  aging_relevance: >-
    AST is less liver-specific than ALT and also rises after intense exercise or muscle
    injury, so an isolated elevation is weak evidence on its own.
  citation: >-
    Kwo PY et al. "ACG Clinical Guideline: Evaluation of Abnormal Liver Chemistries."
    Am J Gastroenterol, 2017.

- canonical_name: tsh
  display_name: TSH
  synonyms: [tsh, thyroid stimulating hormone, thyrotropin]
  canonical_unit: mIU/L
  unit_conversions:
    uiu/ml: 1.0
    miu/ml: 1000.0
  optimal_low: 0.5
  optimal_high: 4.0
  critical_low: 0.1
  critical_high: 10.0
  aging_relevance: >-
    Thyroid function shapes resting metabolic rate, lipids, and energy. Reference ranges
    shift upward with age, so a value read as high in a 30-year-old may be unremarkable
    at 75.
  citation: >-
    Biondi B, Cooper DS. "Subclinical Hypothyroidism: A Review." JAMA, 2019.

- canonical_name: homocysteine
  display_name: Homocysteine
  synonyms: [homocysteine, hcy, total homocysteine]
  canonical_unit: umol/L
  unit_conversions:
    mg/l: 7.397
  optimal_low: null
  optimal_high: 10.0
  critical_low: null
  critical_high: 30.0
  aging_relevance: >-
    Elevated homocysteine is associated with vascular and cognitive ageing and is
    partly a downstream marker of B12, B6, and folate status. Lowering it with vitamins
    has not reliably improved outcomes in trials, so it is treated as a signal to
    investigate, not a target to chase.
  citation: >-
    Smith AD, Refsum H. "Homocysteine, B Vitamins, and Cognitive Impairment."
    Annual Review of Nutrition, 2016.
