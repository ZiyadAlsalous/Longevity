[project]
name = "longevity-insights"
version = "0.1.0"
description = "A multimodal LangGraph pipeline that estimates signals of accelerated aging and writes an evidence-grounded, non-diagnostic lifestyle report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Ziyad Alsalous" }]
keywords = ["langgraph", "multimodal", "mivolo", "health", "pydantic"]

dependencies = [
  "langgraph>=0.2.60,<0.7",
  "langchain-core>=0.3.30,<0.4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6.0,<7",
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3.13,<0.4",
  "pillow>=10.4,<12",
  "reportlab>=4.2,<5",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "streamlit>=1.39,<2",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3,<0.4"]
openai = ["langchain-openai>=0.2.9,<0.4"]
vision = [
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "transformers==4.51.0",
  "accelerate==1.8.1",
  "timm @ git+https://github.com/huggingface/pytorch-image-models@v0.8.13dev0",
  "scipy>=1.13,<2",
]
dev = [
  "ruff>=0.7,<0.13",
  "mypy>=1.13,<2",
  "types-pyyaml>=6.0,<7",
]

[project.urls]
Repository = "https://github.com/ZiyadAlsalous/Longevity"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ANN", "RET", "ARG", "PTH",
  "BLE", "PT", "PIE", "RUF", "PERF", "T20", "ERA", "S", "TRY", "FBT", "DTZ",
]
ignore = [
  "ANN401",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"src/graph.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "cv2.*",
  "langchain_anthropic.*",
  "langchain_openai.*",
  "pytesseract.*",
  "reportlab.*",
  "streamlit.*",
  "langgraph.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true
